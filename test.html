<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNG CAFE</title>

  <link rel="stylesheet" href="test.css?v=9">
</head>
<body>


  <header>

    <h1>TNG CAFE</h1>
    <p>心安らぐ一杯をあなたに</p>
  </header>


  <nav>
    <ul>
      <li><a href="#section1">About Us</a></li>
      <li><a href="#section2">Menu</a></li>
      <li><a href="#section3">Contact</a></li>
    </ul>
  </nav>

  <main>


    <section id="section1">
      <h2>About Us</h2>
      <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。</p>
      <p>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
      <!--カフェの写真-->
      <div>
        <img src="shop.jpg" alt="カフェの店内" width="150">
      </div>
    </section>


    <section id="section2">
      <h2>Menu</h2>

      <div class="menu-container">
        
      <!--コーヒー-->
        <div class="menu-item">
          <img src="coffee.jpg" alt="コーヒー" width="150">
          <p>ブレンドコーヒー</p>
        </div>
        
      
      <!--ケーキ-->
        <div class="menu-item">
          <img src="cheesecake.jpg" alt="チーズケーキ" width="150">
          <p>ベイクドチーズケーキ</p>
        </div>
        
      
　　　　<!--ラテ-->
        <div class="menu-item">
          <img src="rate.jpg" alt="ラテ" width="150">
          <p>カフェラテ</p>
        </div>
      </div>
      
    </section>


    <section id="section3">
      <h2>Contact</h2>
      <form action="#" method="post">

        <label for="name">お名前:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">メールアドレス:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="message">お問い合わせ内容:</label>
        <textarea id="message" name="message" rows="4" cols="40"></textarea><br><br>
        
        
        <button type="submit">送信</button>
      </form>
    </section>
    
      
        
      
  </main>
